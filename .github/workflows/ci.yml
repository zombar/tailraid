name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: long tests + soak

permissions:
  contents: write # release uploads

jobs:
  checks:
    name: tidy + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go mod tidy && go mod tidy -modfile=tools.mod && git diff --exit-code -- go.mod go.sum tools.mod tools.sum
      - run: make fmt-check

  lint:
    name: golangci-lint + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: make lint

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: make vuln

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go test -short -race -cover ./...
        shell: bash

  long:
    name: long (model checker, durability, oracle)
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: make test-long

  mount:
    name: real NFS mount (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nfs-common
      - run: sudo -E env "PATH=$PATH" make test-mount

  soak:
    name: docker-compose soak (quick) → report.html
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: make soak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-report
          path: |
            report.html
            results.jsonl

  release:
    name: release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: make release VERSION=${GITHUB_REF_NAME}
      - run: scripts/changelog.sh notes ${GITHUB_REF_NAME} > dist/release-notes.md && cat dist/release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/tailraid_*
            dist/sha256sums.txt
