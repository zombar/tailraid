name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: long tests + soak

# Least privilege by default; only the release job uploads.
permissions:
  contents: read

# Actions are pinned to the commit behind a release tag (the tag is in the comment), so a
# moved tag cannot change what runs here. Bump by editing both.
jobs:
  checks:
    name: tidy + vendor + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: go mod verify && go mod verify -modfile=tools.mod && go mod verify -modfile=actionlint.mod
      - run: go mod tidy && go mod tidy -modfile=tools.mod && go mod tidy -modfile=actionlint.mod && git diff --exit-code -- go.mod go.sum tools.mod tools.sum actionlint.mod actionlint.sum
      - run: make vendor-check
      - run: make fmt-check

  lint:
    name: golangci-lint + invariants + dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: make lint web-check
      # The per-OS files (*_windows.go, *_darwin.go) only type-check under their GOOS.
      - run: make lint-cross

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: make vuln

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: go test -short -race -cover ./...
        shell: bash

  long:
    name: long (model checker, durability, oracle)
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: make test-long

  mount:
    name: real NFS mount (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nfs-common
      - run: sudo -E env "PATH=$PATH" make test-mount

  soak:
    name: docker-compose soak (quick) → report.html
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: make soak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak-report
          path: |
            report.html
            results.jsonl

  release:
    name: release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, lint, vuln, test]
    permissions:
      contents: write # release uploads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: make release VERSION="${GITHUB_REF_NAME}"
      - name: sign sha256sums.txt (docs/12 §4)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: go run -mod=vendor ./cmd/tailraid-sign -key-env MINISIGN_SECRET_KEY -sign dist/sha256sums.txt && go run -mod=vendor ./cmd/tailraid-sign -verify dist/sha256sums.txt
      - run: scripts/changelog.sh notes "${GITHUB_REF_NAME}" > dist/release-notes.md && cat dist/release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/release-notes.md
          files: |
            dist/tailraid_*
            dist/sha256sums.txt
            dist/sha256sums.txt.minisig
