# The NAT rig of soak phase 27 (docs/20 §10, docs/09 §6): n1 and n5 on the public
# network, n2 behind router A (plain MASQUERADE: an endpoint-independent, cone NAT) and
# n3 behind router B (--random-fully: a symmetric NAT). Each router is a container with
# forwarding on and a MASQUERADE rule on its public interface; the inner nodes route
# through their router (ROUTER in test/soak/entry.sh) and keep their published worker
# ports, which reach them through the host's own bridge. n1 runs `init` and writes the
# join code to /codes; every other node joins through the routers by that code. Same
# images as docker-compose.yml. `make soak-nat` runs phase 27 on it; the relay round of
# phase 26 runs on the main rig.
x-node: &node
  build: .
  cap_add: [NET_ADMIN]
  devices: ["/dev/net/tun:/dev/net/tun"]
  environment: &env
    TOKEN: soakcomposetoken
    TAILRAID_LOG_LEVEL: info
    TAILRAID_LOG_FORMAT: json
    K: "2"
    M: "1"
    CHUNK: 256K
    REPAIR_GRACE: 20s
    FILL_AFTER: 20s
    DISKS: /disks/d1=8G
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS \"http://$$(sed -n 's/.*\"addr\":\"\\([^\"]*\\)\".*/\\1/p' $$TAILRAID_HOME/mesh.json):20481/health\""]
    interval: 2s
    timeout: 2s
    retries: 30

x-worker: &worker
  build: {context: ., dockerfile: Dockerfile.client}
  cap_add: [NET_ADMIN]
  environment: {TAILRAID_LOG_LEVEL: info, TAILRAID_LOG_FORMAT: json, SMB_PASSWORD: soak-copies}
  command: ["worker", "0.0.0.0:20495", "127.0.0.1:20490", "tailraid0"]

x-router: &router
  build: {context: ., dockerfile: Dockerfile.router}
  cap_add: [NET_ADMIN]
  sysctls: {net.ipv4.ip_forward: 1}

services:
  router-a:
    !!merge <<: *router
    environment: {PUBLIC_NET: 172.30.0., NAT_MODE: cone, DROP_NETS: 172.31.2.0/24}
    networks: {public: {ipv4_address: 172.30.0.21}, nat-a: {ipv4_address: 172.31.1.2}}
  router-b:
    !!merge <<: *router
    environment: {PUBLIC_NET: 172.30.0., NAT_MODE: symmetric, DROP_NETS: 172.31.1.0/24}
    networks: {public: {ipv4_address: 172.30.0.22}, nat-b: {ipv4_address: 172.31.2.2}}

  n1:
    !!merge <<: *node
    environment: {!!merge <<: *env, ROLE: init, NODE_NAME: n1}
    networks: {public: {ipv4_address: 172.30.0.11}}
    ports: ["127.0.0.1:20501:20495", "127.0.0.1:20521:20496"]
    volumes: ['n1:/var/lib/tailraid', 'n1-d1:/disks/d1', 'codes:/codes']
  n2:
    !!merge <<: *node
    environment: {!!merge <<: *env, ROLE: join, NODE_NAME: n2, VOTER: "false", ROUTER: 172.31.1.2}
    networks: {nat-a: {ipv4_address: 172.31.1.12}}
    ports: ["127.0.0.1:20502:20495", "127.0.0.1:20522:20496"]
    volumes: ['n2:/var/lib/tailraid', 'n2-d1:/disks/d1', 'codes:/codes']
    depends_on: [n1, router-a]
  n3:
    !!merge <<: *node
    environment: {!!merge <<: *env, ROLE: join, NODE_NAME: n3, VOTER: "false", ROUTER: 172.31.2.2}
    networks: {nat-b: {ipv4_address: 172.31.2.13}}
    ports: ["127.0.0.1:20503:20495", "127.0.0.1:20523:20496"]
    volumes: ['n3:/var/lib/tailraid', 'n3-d1:/disks/d1', 'codes:/codes']
    depends_on: [n2, router-b]
  n5:
    !!merge <<: *node
    environment: {!!merge <<: *env, ROLE: join, NODE_NAME: n5, DISKS: ""}
    networks: {public: {ipv4_address: 172.30.0.15}}
    ports: ["127.0.0.1:20505:20495", "127.0.0.1:20525:20496"]
    volumes: ['n5:/var/lib/tailraid', 'codes:/codes']
    depends_on: [n3]

  w1:
    !!merge <<: *worker
    network_mode: "service:n1"
    depends_on: [n1]
  w2:
    !!merge <<: *worker
    network_mode: "service:n2"
    depends_on: [n2]
  w3:
    !!merge <<: *worker
    network_mode: "service:n3"
    depends_on: [n3]
  w5:
    !!merge <<: *worker
    network_mode: "service:n5"
    depends_on: [n5]

networks:
  public:
    ipam:
      config: [{subnet: 172.30.0.0/24}]
  nat-a:
    ipam:
      config: [{subnet: 172.31.1.0/24}]
  nat-b:
    ipam:
      config: [{subnet: 172.31.2.0/24}]

volumes:
  n1: {}
  n2: {}
  n3: {}
  n5: {}
  n1-d1: {}
  n2-d1: {}
  n3-d1: {}
  codes: {}
